<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Home Page - AestheticEMR</title>
  <base href="/">


  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    #pre-bootstrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f7f9fc 0%, #eef3fb 100%);
      font-family: Roboto, Arial, sans-serif;
    }

    .boot-shell {
      width: min(520px, 92vw);
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
    }

    .boot-title {
      margin: 0 0 14px;
      font-size: 1rem;
      font-weight: 500;
      color: #223;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #d8e4ff;
      border-top-color: #1976d2;
      border-radius: 50%;
      animation: spin .9s linear infinite;
      margin-bottom: 16px;
    }

    .skeleton {
      height: 10px;
      border-radius: 999px;
      margin: 8px 0;
      background: linear-gradient(90deg, #eef2f7 25%, #e0e8f7 37%, #eef2f7 63%);
      background-size: 400% 100%;
      animation: shimmer 1.4s ease infinite;
    }

    .w-100 {
      width: 100%;
    }

    .w-80 {
      width: 80%;
    }

    .w-60 {
      width: 60%;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes shimmer {
      0% {
        background-position: 100% 0;
      }

      100% {
        background-position: 0 0;
      }
    }
  </style>
</head>

<body>
  <app-root>
    <div id="pre-bootstrap">
      <div class="boot-shell" aria-live="polite" aria-busy="true">
        <div class="spinner"></div>
        <h1 class="boot-title">Loading AestheticEMR…</h1>
        <div class="skeleton w-100"></div>
        <div class="skeleton w-80"></div>
        <div class="skeleton w-60"></div>
      </div>
    </div>
  </app-root>
</body>

</html>
