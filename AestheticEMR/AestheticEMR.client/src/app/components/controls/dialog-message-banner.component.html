@if (visible) {
  <div class="dialog-banner" [class.success]="type === 'success'" [class.error]="type === 'error'" [class.warning]="type === 'warning'" [class.info]="type === 'info'" role="status" aria-live="polite">
    <mat-icon class="banner-icon">{{ iconName() }}</mat-icon>
    <div class="banner-content">
      @if (title) {
        <div class="banner-title">{{ title }}</div>
      }
      <div class="banner-message">{{ message }}</div>
    </div>
    <button mat-icon-button type="button" class="banner-close" (click)="close()" aria-label="Close banner">
      <mat-icon>close</mat-icon>
    </button>
  </div>
}
