<div @fadeInOut class="page-container">
  <mat-card class="shift-card">
    <mat-card-header>
      <mat-card-title>Shifts Master</mat-card-title>
      <mat-card-subtitle>Maintain shifts.</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      @if (loading()) {
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
      }

      <div class="toolbar-grid">
        <mat-form-field appearance="outline">
          <mat-label>Search</mat-label>
          <input matInput [ngModel]="searchText()" (ngModelChange)="applyFilter($event)" placeholder="Search shifts master" />
        </mat-form-field>

        <div class="toolbar-actions">
          <button mat-raised-button color="primary" (click)="openCreateDialog()">
            <mat-icon>add</mat-icon>
            New Shift Master
          </button>
          <button mat-stroked-button (click)="refresh()">
            <mat-icon>refresh</mat-icon>
            Refresh
          </button>
        </div>
      </div>

      <div class="legend-row">
        <span>Records: {{ filteredCount() }}</span>
      </div>

      <div class="table-shell">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z1 shift-table">
          <ng-container matColumnDef="shiftName">
            <th mat-header-cell *matHeaderCellDef>Shift Name</th>
            <td mat-cell *matCellDef="let row">{{ row.shiftName }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button color="primary" matTooltip="Edit" (click)="openEditDialog(row)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" matTooltip="Delete" (click)="deleteRow(row)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator [pageSize]="10" [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
