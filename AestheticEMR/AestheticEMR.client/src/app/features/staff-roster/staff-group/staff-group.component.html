<div @fadeInOut class="page-container">
  <mat-card class="group-card">
    <mat-card-header>
      <mat-card-title>Staff Group</mat-card-title>
      <mat-card-subtitle>Maintain staff groups.</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      @if (loading()) {
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
      }

      <div class="toolbar-grid">
        <mat-form-field appearance="outline">
          <mat-label>Search</mat-label>
          <input matInput [ngModel]="searchText()" (ngModelChange)="applyFilter($event)" placeholder="Search group" />
        </mat-form-field>

        <div class="toolbar-actions">
          <button mat-raised-button color="primary" (click)="openCreateDialog()">
            <mat-icon>add</mat-icon>
            New Staff Group
          </button>
          <button mat-stroked-button (click)="refresh()">
            <mat-icon>refresh</mat-icon>
            Refresh
          </button>
        </div>
      </div>

      <div class="legend-row">
        <span>Records: {{ filteredCount() }}</span>
      </div>

      <div class="table-shell">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z1 group-table">
          <ng-container matColumnDef="groupName">
            <th mat-header-cell *matHeaderCellDef>Group Name</th>
            <td mat-cell *matCellDef="let row">{{ row.groupName }}</td>
          </ng-container>

          <ng-container matColumnDef="staffName">
            <th mat-header-cell *matHeaderCellDef>Staff Name</th>
            <td mat-cell *matCellDef="let row">{{ row.staffName }}</td>
          </ng-container>

          <ng-container matColumnDef="deptName">
            <th mat-header-cell *matHeaderCellDef>Department</th>
            <td mat-cell *matCellDef="let row">{{ row.deptName }}</td>
          </ng-container>

          <ng-container matColumnDef="assigned">
            <th mat-header-cell *matHeaderCellDef>Assigned</th>
            <td mat-cell *matCellDef="let row">{{ row.assigned }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button color="primary" matTooltip="Edit not allowed" (click)="showEditDeleteNotAllowedMessage()">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" matTooltip="Delete not allowed" (click)="showEditDeleteNotAllowedMessage()">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator [pageSize]="10" [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
